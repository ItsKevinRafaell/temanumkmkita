<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri — Rupa Lokal</title>
  <meta name="description" content="Galeri produk, toko, dan momen di balik layar Rupa Lokal." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body>
  <header class="site-nav" data-include="nav"></header>

  <section class="page-hero">

      <span class="eyebrow reveal">Galeri</span>
      <h1 class="reveal">Karya, toko, dan cerita di baliknya.</h1>
      <p class="reveal">Intip produk &amp; suasana Rupa Lokal lebih dekat.</p>

    <div class="container">
      <div class="gallery-mosaic reveal-stagger">
        <img class="reveal" src="/porto/rupa-lokal/assets/img/gen/hero.jpg" alt="Suasana toko" loading="lazy" onerror="this.src='/porto/rupa-lokal/assets/img/gen/hero.jpg'" />
        <img class="reveal" src="/porto/rupa-lokal/assets/img/gen/prod-1.jpg" alt="Tote batik" loading="lazy" onerror="this.src='/porto/rupa-lokal/assets/img/gen/hero.jpg'" />
        <img class="reveal" src="/porto/rupa-lokal/assets/img/gen/prod-3.jpg" alt="Tas rotan" loading="lazy" onerror="this.src='/porto/rupa-lokal/assets/img/gen/hero.jpg'" />
        <img class="wide reveal" src="/porto/rupa-lokal/assets/img/gen/store.jpg" alt="Toko Rupa Lokal" loading="lazy" onerror="this.src='/porto/rupa-lokal/assets/img/gen/hero.jpg'" />
        <img class="reveal" src="/porto/rupa-lokal/assets/img/gen/prod-2.jpg" alt="Mug keramik" loading="lazy" onerror="this.src='/porto/rupa-lokal/assets/img/gen/hero.jpg'" />
        <img class="reveal" src="/porto/rupa-lokal/assets/img/gen/prod-4.jpg" alt="Scarf" loading="lazy" onerror="this.src='/porto/rupa-lokal/assets/img/gen/hero.jpg'" />
        <img class="wide reveal" src="/porto/rupa-lokal/assets/img/gen/lifestyle.jpg" alt="Produk dalam keseharian" loading="lazy" onerror="this.src='/porto/rupa-lokal/assets/img/gen/hero.jpg'" />
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="cta-section">
    <div class="container">
      <div class="cta-inner reveal">
        <h2>Mau salah satunya jadi milikmu?</h2>
        <p>Order via WhatsApp — stok terbatas.</p>
        <a class="btn-ghost" href="https://wa.me/6281234567890?text=Halo%20Rupa%20Lokal" target="_blank" rel="noopener">Order Sekarang</a>
      </div>
    </div>
  </section>

  <footer class="site-footer" data-include="footer"></footer>

  <a class="wa-float" href="https://wa.me/6281234567890" target="_blank" rel="noopener" aria-label="Chat WhatsApp">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
