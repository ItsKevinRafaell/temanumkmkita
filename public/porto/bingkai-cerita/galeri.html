<body>

      <p class="page-hero__sub">Ini bukan hasil pilihan yang dipoles. Inilah gaya kami, konsisten di setiap acara.</p>
    </div>
  </section>

  <section class="gallery-page">
    <div class="container">
      <div class="gallery-masonry reveal">
        <img src="/porto/bingkai-cerita/assets/img/gen/wedding1.jpg" alt="Wedding" loading="lazy" />
        <img src="/porto/bingkai-cerita/assets/img/gen/prewed1.jpg" alt="Prewedding" loading="lazy" />
        <img src="/porto/bingkai-cerita/assets/img/gen/gallery2.jpg" alt="Fine art" loading="lazy" />

        <img src="/porto/bingkai-cerita/assets/img/gen/gallery1.jpg" alt="Resepsi" loading="lazy" />
        <img src="/porto/bingkai-cerita/assets/img/gen/detail1.jpg" alt="Detail" loading="lazy" />
        <img src="/porto/bingkai-cerita/assets/img/gen/gallery3.jpg" alt="Outdoor" loading="lazy" />
        <img src="/porto/bingkai-cerita/assets/img/gen/hero.jpg" alt="Momen" loading="lazy" />
        <img src="/porto/bingkai-cerita/assets/img/gen/team.jpg" alt="Behind the scenes" loading="lazy" />

  <footer class="site-footer" data-include="footer"></footer>
  <a class="wa-float" href="https://wa.me/6281234567890?text=Halo%20Bingkai%20Cerita" target="_blank" rel="noopener" aria-label="Chat WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.45 9.9-9.91C21.95 6.45 17.5 2 12.04 2z"/></svg></a>
  <script src="/porto/bingkai-cerita/assets/js/include.js"></script>
  <script>
    document.documentElement.classList.add('js-reveal');
    (function(){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}});},{threshold:0.08});document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});setTimeout(function(){document.querySelectorAll('.reveal:not(.visible)').forEach(function(el){el.classList.add('visible');});},1400);document.addEventListener('include:loaded',function(ev){if(ev.detail&&ev.detail.name==='nav'){var nav=document.querySelector('.site-nav');window.addEventListener('scroll',function(){nav.classList.toggle('scrolled',window.scrollY>60);},{passive:true});var t=document.querySelector('.nav-toggle'),l=document.querySelector('.nav-links');if(t&&l){t.addEventListener('click',function(){var o=l.classList.toggle('open');t.classList.toggle('active',o);t.setAttribute('aria-expanded',o);});}}});})();
  </script>
