<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog — Helai Studio</title>
  <meta name="description" content="Jelajahi katalog Helai Studio: atasan, bawahan, dress, dan aksesoris. Filter berdasarkan kategori dan pesan favoritmu langsung via WhatsApp." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/palette.css" />
</head>
<body>

  <header class="site-nav" data-include="nav"></header>

  <!-- ============ KATALOG ============ -->
  <section>
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">Katalog Koleksi</span>
        <h2>Pilih yang bercerita tentang Anda</h2>
        <p>Klik kategori untuk menyaring, lalu klik produk untuk melihat detail bahan, ukuran, dan memesan langsung via WhatsApp.</p>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar reveal" id="filter-bar">
        <button class="filter-btn active" data-filter="all">Semua</button>
        <button class="filter-btn" data-filter="atasan">Atasan</button>
        <button class="filter-btn" data-filter="bawahan">Bawahan</button>
        <button class="filter-btn" data-filter="dress">Dress</button>
        <button class="filter-btn" data-filter="aksesoris">Aksesoris</button>
      </div>

      <!-- GRID PRODUK (diisi oleh katalog.js) -->
      <div class="produk-grid" id="produk-grid">
        <noscript>
          <p class="no-result">Aktifkan JavaScript untuk melihat katalog produk kami, atau hubungi kami via WhatsApp di 0812-3456-7890.</p>
        </noscript>
      </div>
    </div>
  </section>

  <!-- ============ MODAL DETAIL PRODUK ============ -->
  <div class="modal-overlay" id="produk-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button class="modal-close" aria-label="Tutup detail">&times;</button>
      <div class="modal-img"><!-- diisi visualHTML() oleh katalog.js --></div>
      <div class="modal-body">
        <span class="card-kategori js-kategori"></span>
        <h2 class="js-nama"></h2>
        <div class="modal-harga"></div>
        <p class="modal-desc"></p>
        <ul class="modal-meta">
          <li><b>Bahan</b><span class="js-bahan"></span></li>
          <li><b>Ukuran</b><span class="js-ukuran"></span></li>
        </ul>
        <a class="btn btn-wa" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.45 9.9-9.91C21.95 6.45 17.5 2 12.04 2z"/></svg>
          Pesan via WhatsApp
        </a>
      </div>
    </div>
  </div>

  <footer class="site-footer" data-include="footer"></footer>

  <a class="wa-float" href="https://wa.me/6281234567890?text=Halo%20Helai%20Studio" target="_blank" rel="noopener" aria-label="Chat WhatsApp">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.45 9.9-9.91C21.95 6.45 17.5 2 12.04 2zm5.8 14.12c-.24.68-1.42 1.31-1.95 1.35-.5.04-.5.4-3.16-.66-2.67-1.05-4.35-3.77-4.48-3.94-.13-.18-1.07-1.42-1.07-2.71 0-1.29.68-1.92.92-2.19.24-.26.53-.33.7-.33.18 0 .35 0 .5.01.16.01.38-.06.59.45.24.58.81 2 .88 2.14.07.13.12.29.02.47-.09.18-.14.29-.27.44-.13.16-.28.35-.4.47-.13.13-.27.28-.12.54.15.26.66 1.09 1.42 1.76.98.87 1.8 1.14 2.06 1.27.26.13.41.11.56-.07.15-.18.65-.76.82-1.02.17-.26.35-.22.59-.13.24.09 1.52.72 1.78.85.26.13.43.19.5.3.06.11.06.66-.18 1.34z"/></svg>
  </a>

  <script src="assets/js/include.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/katalog.js"></script>
</body>
</html>
